name: CI with Mattermost Notification
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Run tests
        id: tests
        run: npm test

      - name: Lint (oxlint)
        if: always() && steps.install.outcome == 'success'
        run: npm run lint

      - name: Notify Mattermost
        if: always()   # run even if the tests failed
        env:
          WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then ICON="✅"; else ICON="❌"; fi

          TEXT=$(printf '#### %s Build %s: %s @ %s\n**Author:** %s\n**Commit:** [%s](%s)\n**Message:** %s\n**Tests:** %s\n[View workflow run](%s)' \
            "$ICON" "$JOB_STATUS" "$REPO" "$BRANCH" "$ACTOR" "${SHA:0:7}" "$COMMIT_URL" "$COMMIT_MSG" "$TEST_OUTCOME" "$RUN_URL")

          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg text "$TEXT" '{text: $text}')" \
            "$WEBHOOK_URL"
